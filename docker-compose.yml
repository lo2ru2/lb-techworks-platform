services:
  postgres:
    image: postgres:16
    container_name: lbtechworks_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lbtechworks}
      POSTGRES_USER: ${POSTGRES_USER:-lbtechworks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lbtechworks}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: lbtechworks_redis
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  mongodb:
    image: mongo:7
    container_name: lbtechworks_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-lbtechworks}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-lbtechworks}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-lbtechworks_analytics}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./infra/mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
